<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Staff Hub</title>
<meta name="theme-color" content="#f2f2f7">
<script>
(function () {
  var BUILD = "40";
  function report(kind, message, source, line, column, stack) {
    try {
      navigator.sendBeacon("_client-error", new Blob([JSON.stringify({
        kind: kind, message: String(message || ""), stack: String(stack || ""),
        source: source || "", line: line || null, column: column || null,
        url: location.href, build: BUILD,
      })], { type: "application/json" }));
    } catch (e) {}
  }
  window.onerror = function (m, s, l, c, err) {
    report("error", m, s, l, c, err && err.stack);
  };
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason || {};
    report("unhandledrejection", r.message || r, "", null, null, r.stack);
  });
})();
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ios.css">
<link rel="stylesheet" href="desktop.css">
</head>
<body>
<script>
/* Apply the saved theme before the first paint: no light-to-dark flash. */
(function () {
  try {
    var saved = localStorage.getItem("staff_theme") || "auto";
    var tgw = window.Telegram && window.Telegram.WebApp;
    var system = tgw && tgw.initData ? tgw.colorScheme : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var dark = saved === "dark" || (saved === "auto" && system === "dark");
    document.body.dataset.theme = saved;
    if (dark) document.body.classList.add("dark");
    var bg = dark ? "#000000" : "#f2f2f7";
    document.documentElement.style.backgroundColor = bg;
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", bg);
  } catch (e) {}
})();
</script>
<main class="app scroll-content" id="app"></main>
<div class="scroll-edge scroll-edge--top" aria-hidden="true"></div>
